[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconfuzz"
version = "0.1.0"
description = "Lightweight Directory & Subdomain Fuzzer for authorized penetration testing"
readme = "Readme.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "typer>=0.12",
    "rich>=13",
    "anyio>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "orjson>=3",
]

[project.scripts]
reconfuzz = "reconfuzz.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["reconfuzz*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pytest_asyncio]
mode = "auto"
